services:
  beszel-hub:
    image: henrygd/beszel:0.18.7
    container_name: beszel
    hostname: beszel
    restart: unless-stopped

    ports:
      - '8090:8090'

    environment:
      TZ: ${TZ}

    volumes:
      - ./data:/beszel_data

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  beszel-agent:
    image: henrygd/beszel-agent:0.18.7
    container_name: beszel-agent
    hostname: beszel-agent
    restart: unless-stopped

    depends_on:
      - beszel-hub

    # Required for the agent to report accurate host-level network stats --
    # without host networking it would only see its own isolated network,
    # not the Pi's real interfaces.
    network_mode: host

    environment:
      TZ: ${TZ}
      LISTEN: ${BESZEL_AGENT_LISTEN}
      # Hub's SSH public key -- verifies the agent is talking to the
      # legitimate hub. Generated once in the hub, same for every agent
      # it manages, shown when adding a new system.
      KEY: ${BESZEL_HUB_PUBLIC_KEY}
      # One-time pairing token, generated per-system in the hub's
      # "Add System" dialog.
      TOKEN: ${BESZEL_AGENT_TOKEN}
      # Lets the agent initiate an outgoing connection to the hub,
      # rather than the hub needing to reach the agent directly.
      HUB_URL: http://192.168.1.79:8090

    volumes:
      - ./agent_data:/var/lib/beszel-agent
      # Read-only, gives the agent visibility into per-container stats.
      # Mounted directly rather than through a filtered socket-proxy --
      # see docs/beszel-monitoring.md for why, and the CVEs this version
      # is already patched against.
      - /var/run/docker.sock:/var/run/docker.sock:ro

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'