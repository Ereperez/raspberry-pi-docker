services:
  beszel-hub:
    image: henrygd/beszel:0.18.7
    container_name: beszel
    hostname: beszel
    restart: unless-stopped

    ports:
      - '8090:8090'

    environment:
      TZ: ${TZ}

    volumes:
      - ./data:/beszel_data
      - ./socket:/beszel_socket

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  beszel-agent:
    image: henrygd/beszel-agent:0.18.7
    container_name: beszel-agent
    hostname: beszel-agent
    restart: unless-stopped

    depends_on:
      - beszel-hub

    # Required for the agent to report accurate host-level network stats --
    # without host networking it would only see the container's own
    # isolated network, not the Pi's real interfaces.
    network_mode: host

    environment:
      TZ: ${TZ}
      LISTEN: /beszel_socket/beszel.sock
      # Set after generating a key from the hub's "Add System" dialog
      KEY: ${BESZEL_AGENT_KEY}

    volumes:
      - ./socket:/beszel_socket
      - ./agent_data:/var/lib/beszel-agent
      # Read-only, gives the agent visibility into per-container stats.
      # Mounted directly rather than through a filtered socket-proxy --
      # see docs/beszel-monitoring.md for why, and the CVEs this version
      # is already patched against.
      - /var/run/docker.sock:/var/run/docker.sock:ro

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'