services:
  unbound:
    image: klutchell/unbound:v1.25.2
    container_name: unbound
    hostname: unbound

    restart: unless-stopped
    init: true

    volumes:
      - ./unbound:/etc/unbound/custom.conf.d:ro

    networks:
      - dns

    healthcheck:
    # Use the drill wrapper binary to reduce the exit codes to 0 or 1 for healthchecks
      test: ['CMD', 'drill-hc', '@127.0.0.1', 'dnssec.works']
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'


  # More info at https://github.com/pi-hole/docker-pi-hole/ and https://docs.pi-hole.net/
  pihole:
    image: pihole/pihole:2026.07.2
    container_name: pihole
    hostname: pihole

    restart: unless-stopped
    init: true

    depends_on:
      unbound:
        condition: service_healthy

    ports:
      # DNS Ports
      - '53:53/tcp'
      - '53:53/udp'
      # Default HTTP Port
      - '80:80/tcp'
      # Default HTTPs Port. FTL will generate a self-signed certificate
      - '443:443/tcp'
      # Uncomment the below if using Pi-hole as your DHCP Server
      #- '67:67/udp'
      # Uncomment the line below if you are using Pi-hole as your NTP server
      #- '123:123/udp'

    environment:
      # Set the appropriate timezone for your location from
      # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones, e.g:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_upstreams: unbound
      # If using Docker's default `bridge` network setting the dns listening mode should be set to 'ALL'
      FTLCONF_dns_listeningMode: 'all'

    volumes:
      - ./pihole:/etc/pihole
      - ./dnsmasq.d:/etc/dnsmasq.d

    #cap_add:
      # Required if you are using Pi-hole as your DHCP server, else not needed
      #- NET_ADMIN
      # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      #- SYS_TIME
      # Optional, if Pi-hole should get some more processing time
      #- SYS_NICE

    networks:
      - dns

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  dns:
    name: dns
    driver: bridge