storage:
  type: sqlite
  path: /data/data.db

alerting:
  custom:
    url: "https://hc-ping.com/${HEALTHCHECKS_UUID}[ALERT_TRIGGERED_OR_RESOLVED]"
    method: POST
    placeholders:
      ALERT_TRIGGERED_OR_RESOLVED:
        TRIGGERED: "/fail"
        RESOLVED: ""
    body: |
      {
        "endpoint": "[ENDPOINT_NAME]",
        "description": "[ALERT_DESCRIPTION]",
        "status": "[ALERT_TRIGGERED_OR_RESOLVED]"
      }
    default-alert:
      failure-threshold: 2
      success-threshold: 1
      send-on-resolved: true

web:
  port: 8080

ui:
  title: Homelab Status
  header: Homelab Status

endpoints:
  - name: Pi-hole
    group: DNS
    url: "http://192.168.1.79/admin/login"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 1000"
    alerts:
      - type: custom
        description: "Pi-hole is down"

  - name: Unbound
    group: DNS
    url: "192.168.1.79"
    dns:
      query-name: "dnssec.works"
      query-type: "A"
    interval: 60s
    conditions:
      - "[DNS_RCODE] == NOERROR"
    alerts:
      - type: custom
        description: "Unbound DNS resolution failing"

  - name: Homepage
    group: Dashboard
    url: "http://192.168.1.79:3000"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        description: "Homepage is down"

  - name: Backrest
    group: Backup
    url: "http://192.168.1.79:9898"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        description: "Backrest is down"

  - name: Portainer
    group: Docker Tools
    url: "http://192.168.1.79:9000"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        description: "Portainer is down"

  - name: Beszel Hub
    group: Monitoring
    url: "http://192.168.1.79:8090"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        description: "Beszel Hub is down"

  - name: WUD
    group: Homelab Tools
    url: "http://192.168.1.79:3001"
    interval: 60s
    headers:
      Authorization: "Basic ${WUD_BASIC_AUTH_B64}"
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        description: "WUD is down"

  - name: Tailscale
    group: Homelab Tools
    url: "https://api.tailscale.com/api/v2/device/${GATUS_TAILSCALE_DEVICE_ID}"
    interval: 300s
    headers:
      Authorization: "Bearer ${GATUS_TAILSCALE_API_KEY}"
    conditions:
      - "[STATUS] == 200"
      - "[BODY].authorized == true"
    alerts:
      - type: custom
        description: "Tailscale device unreachable or deauthorized"

  # All eight endpoints above share one Healthchecks check (HEALTHCHECKS_UUID
  # below) -- Gatus only supports one global custom-provider config. This
  # means Healthchecks' up/down state reflects "something is failing", not
  # which one specifically; the endpoint name is in the ping body if you
  # need to check Healthchecks' own ping log for detail. Split into
  # per-endpoint checks later if that granularity turns out to matter.